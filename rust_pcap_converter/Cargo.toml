[package]
name = "pcap_to_parquet"
version = "0.1.0"
edition = "2024"

[dependencies]
rtshark = "3.2"
polars = { version = "0.55", default-features = false, features = ["lazy", "parquet", "temporal"] }
polars-utils = "0.55"
serde = { version = "1.0", features = ["derive"] }
clap = { version = "4.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
